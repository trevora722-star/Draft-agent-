# Render Blueprint — wedding photo sharing platform (this branch only).
#
# NOTE: on the default branch this file describes the NPO agent demo instead.
# When creating the Blueprint in Render, point it at the branch
# `claude/wedding-photo-platform-mxs50e` to get the wedding album.
#
# Usage:
#   1. In Render: New + > Blueprint > pick this repo and this branch.
#   2. Set WEDDING_USERNAME and WEDDING_PASSWORD when prompted — this is the
#      login you'll share with the other wedding guests.
#   3. Render gives you a URL like wedding-photos.onrender.com — share it.
#
# The attached disk keeps uploaded photos across restarts and deploys.
# Disks require a paid plan (Starter ~$7/mo + ~$0.25/GB/mo). See
# wedding-photos/README.md if you want to trial it on the free plan first.

services:
  - type: web
    name: wedding-photos
    runtime: python
    plan: starter
    rootDir: wedding-photos
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WEDDING_USERNAME
        sync: false  # set in the Render dashboard — the login guests will use
      - key: WEDDING_PASSWORD
        sync: false  # set in the Render dashboard
      - key: WEDDING_ADMIN_PASSWORD
        sync: false  # different password, same username -> can delete photos
      - key: WEDDING_TITLE
        value: "Our Wedding Album"  # change to e.g. "Anna & James — June 2026"
      - key: WEDDING_DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: wedding-photo-data
      mountPath: /var/data
      sizeGB: 10
