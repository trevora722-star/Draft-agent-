# Render Blueprint — ConfettiRoll, the multi-tenant event photo platform.
#
# NOTE: on the default branch this file describes the NPO agent demo instead.
# When creating the Blueprint in Render, point it at the branch
# `claude/wedding-photo-platform-mxs50e`.
#
# Deploy:
#   1. In Render: New + > Blueprint > pick this repo, branch
#      claude/wedding-photo-platform-mxs50e.
#   2. Fill in the sync:false env vars when prompted (all optional — the
#      platform runs without them; each one just switches a feature on).
#   3. Render gives you https://confettiroll.onrender.com. For real domains,
#      add confettiroll.com AND *.confettiroll.com as custom domains on the
#      service (Settings > Custom Domains) and create the DNS records — the
#      wildcard is what makes every event subdomain work. See
#      confettiroll/README.md.
#
# The attached disk keeps the database and all uploaded media across
# restarts and deploys. Disks require a paid plan (Starter ~$7/mo +
# ~$0.25/GB/mo).
#
# (The original single-event wedding-photos app still lives in
# wedding-photos/ — deploy it separately only if you want it; it was
# superseded by this platform.)

services:
  - type: web
    name: confettiroll
    runtime: python
    plan: starter
    rootDir: confettiroll
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CR_BASE_DOMAIN
        value: confettiroll.com  # change if you launch under a different name
      - key: CR_DATA_DIR
        value: /var/data
      - key: CR_KIOSK_KEY
        generateValue: true  # unlocks /kiosk and /outreach on booth devices
      - key: ANTHROPIC_API_KEY
        sync: false  # optional — enables AI captions, recap, brand kit, booth agent
      - key: STRIPE_SECRET_KEY
        sync: false  # optional — enables real checkout (beta mode without it)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # optional — from the Stripe webhook for /stripe/webhook
      - key: GOOGLE_CLIENT_ID
        sync: false  # optional — enables "Sign in with Google" (identity only)
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # optional
      - key: RESEND_API_KEY
        sync: false  # optional — enables book-announcement emails (resend.com)
      - key: MAIL_FROM
        sync: false  # optional — sender, e.g. "ConfettiRoll <hello@confettiroll.com>"
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: confettiroll-data
      mountPath: /var/data
      sizeGB: 25
