<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConfettiRoll — Sign in</title>
<style>
  :root {
    --ink: #2c2733; --soft: #7d7488; --pink: #e85d8a;
    --paper: #fdfbf7; --card: #ffffff; --line: #ece6ef;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    background: var(--paper); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  .logo { font-size: 20px; font-weight: bold; font-family: "Helvetica Neue", Arial, sans-serif; margin-bottom: 26px; }
  .logo span { color: var(--pink); }
  .logo a { color: inherit; text-decoration: none; }
  .card {
    width: 100%; max-width: 400px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 38px 36px; box-shadow: 0 18px 50px rgba(44, 39, 51, 0.08);
  }
  h1 { font-size: 26px; font-weight: normal; margin-bottom: 20px; }
  label {
    display: block; font-size: 12.5px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--soft); margin: 16px 0 6px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fdfcfa; color: var(--ink); font-family: inherit;
  }
  input:focus { outline: 2px solid var(--pink); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 26px; padding: 13px; font-size: 15px;
    letter-spacing: 1.5px; text-transform: uppercase; border: none;
    border-radius: 8px; background: var(--pink); color: #fff;
    cursor: pointer; font-family: "Helvetica Neue", Arial, sans-serif;
  }
  button:hover { filter: brightness(1.07); }
  .alt { text-align: center; margin-top: 18px; font-size: 14px; color: var(--soft); }
  .alt a { color: var(--pink); }
  .error {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px;
    background: #f9e9e6; color: #94433a; font-size: 14px;
  }
</style>
</head>
<body>
  <div class="logo"><a href="/">Confetti<span>●</span>Roll</a></div>
  <form class="card" method="post" action="/login">
    <h1>Sign in</h1>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    {{GOOGLE_BTN}}
    {{ERROR}}
    <p class="alt">New here? <a href="/signup">Create an account</a></p>
  </form>
</body>
</html>
