<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --ink: #3d3733;
    --soft: #8a7f76;
    --accent: #7d8c6f;
    --accent-dark: #66755a;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #e8e1d8;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 40px 20px 8px;
  }
  .ornament { font-size: 18px; color: var(--accent); letter-spacing: 8px; }
  h1 { font-size: 34px; font-weight: normal; font-style: italic; margin: 10px 0 4px; }
  .sub { color: var(--soft); font-size: 15px; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 22px 16px 10px;
  }
  .btn {
    padding: 11px 22px;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.ghost {
    background: transparent;
    color: var(--soft);
    border: 1px solid var(--line);
  }
  .btn.ghost:hover { color: var(--ink); border-color: var(--soft); background: transparent; }
  #name-input {
    padding: 10px 16px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    width: 190px;
  }
  #name-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #status {
    text-align: center;
    color: var(--soft);
    font-size: 14px;
    min-height: 22px;
    padding: 4px 16px;
  }
  #status.busy { color: var(--accent-dark); }
  #status.error { color: #94433a; }
  .grid {
    columns: 4 260px;
    column-gap: 14px;
    padding: 14px 18px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .tile {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    cursor: pointer;
    position: relative;
  }
  .tile img { width: 100%; display: block; }
  .tile .who {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 10px 7px;
    font-size: 13px;
    color: #fff;
    background: linear-gradient(transparent, rgba(30, 26, 22, 0.65));
    opacity: 0;
    transition: opacity 0.15s;
  }
  .tile:hover .who { opacity: 1; }
  .empty {
    text-align: center;
    color: var(--soft);
    padding: 70px 20px;
    font-style: italic;
    font-size: 17px;
  }
  /* lightbox */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(25, 22, 19, 0.94);
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  #lightbox.open { display: flex; }
  #lb-img-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 12px;
  }
  #lb-img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  #lb-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    color: #d9d2c9;
    font-size: 14px;
  }
  #lb-bar a, #lb-bar button {
    color: #f2ede6;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  #lb-bar a:hover, #lb-bar button:hover { background: rgba(255, 255, 255, 0.24); }
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.10);
    border: none;
    color: #f2ede6;
    font-size: 26px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
  }
  .lb-nav:hover { background: rgba(255, 255, 255, 0.24); }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }
  @media (max-width: 600px) {
    h1 { font-size: 27px; }
    .grid { columns: 2 140px; padding: 10px 10px 50px; }
  }
</style>
</head>
<body>
  <header>
    <div class="ornament">✦ ✦ ✦</div>
    <h1>{{TITLE}}</h1>
    <p class="sub">Share the moments you captured — every photo you add appears for all the guests.</p>
  </header>

  <div class="toolbar">
    <input id="name-input" placeholder="Your name (shown on photos)" maxlength="60">
    <button class="btn" id="upload-btn">Upload photos</button>
    <form method="post" action="/logout" style="display:inline">
      <button class="btn ghost" type="submit">Sign out</button>
    </form>
    <input id="file-input" type="file" accept="image/*,.heic,.heif" multiple hidden>
  </div>
  <p id="status"></p>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No photos yet — be the first to share one!</p>

  <div id="lightbox">
    <div id="lb-img-wrap"><img id="lb-img" alt=""></div>
    <button class="lb-nav" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lb-nav" id="lb-next" aria-label="Next">›</button>
    <div id="lb-bar">
      <span id="lb-caption"></span>
      <span>
        <a id="lb-download" href="#">Download</a>
        <button id="lb-close">Close</button>
      </span>
    </div>
  </div>

<script>
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const status = document.getElementById("status");
  const nameInput = document.getElementById("name-input");
  const fileInput = document.getElementById("file-input");
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbCaption = document.getElementById("lb-caption");
  const lbDownload = document.getElementById("lb-download");

  let photos = [];
  let lbIndex = 0;

  nameInput.value = localStorage.getItem("wedding_uploader") || "";
  nameInput.addEventListener("change", () =>
    localStorage.setItem("wedding_uploader", nameInput.value.trim()));

  function setStatus(text, cls) {
    status.textContent = text || "";
    status.className = cls || "";
  }

  function captionFor(p) {
    let when = "";
    if (p.uploaded_at) {
      when = new Date(p.uploaded_at * 1000).toLocaleDateString(undefined,
        { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    return p.uploader ? `Shared by ${p.uploader}${when ? " · " + when : ""}` : when;
  }

  function render() {
    grid.innerHTML = "";
    empty.hidden = photos.length > 0;
    photos.forEach((p, i) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = "/thumbs/" + p.id;
      img.alt = p.original_name || "wedding photo";
      tile.appendChild(img);
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = captionFor(p);
      tile.appendChild(who);
      tile.addEventListener("click", () => openLightbox(i));
      grid.appendChild(tile);
    });
  }

  async function load() {
    const res = await fetch("/api/photos");
    if (res.status === 401) { location.href = "/login"; return; }
    const data = await res.json();
    photos = data.photos || [];
    render();
  }

  document.getElementById("upload-btn").addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files);
    fileInput.value = "";
    if (!files.length) return;
    setStatus(`Uploading ${files.length} photo${files.length > 1 ? "s" : ""}…`, "busy");
    const form = new FormData();
    files.forEach(f => form.append("files", f));
    form.append("uploader", nameInput.value.trim());
    try {
      const res = await fetch("/api/upload", { method: "POST", body: form });
      if (res.status === 401) { location.href = "/login"; return; }
      const data = await res.json();
      const saved = (data.saved || []).length;
      const errors = data.errors || [];
      let msg = saved ? `Added ${saved} photo${saved > 1 ? "s" : ""}. Thank you!` : "";
      if (errors.length) {
        msg += ` ${errors.length} skipped (${errors[0].file}: ${errors[0].reason}).`;
      }
      setStatus(msg.trim() || "Nothing was uploaded.", errors.length ? "error" : "");
      await load();
    } catch (err) {
      setStatus("Upload failed - please check your connection and try again.", "error");
    }
  });

  function openLightbox(i) {
    lbIndex = i;
    const p = photos[i];
    lbImg.src = "/photos/" + p.id;
    lbCaption.textContent = captionFor(p);
    lbDownload.href = "/photos/" + p.id + "?download=1";
    lightbox.classList.add("open");
  }
  function closeLightbox() { lightbox.classList.remove("open"); lbImg.src = ""; }
  function step(delta) {
    if (!photos.length) return;
    openLightbox((lbIndex + delta + photos.length) % photos.length);
  }

  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
  document.getElementById("lb-next").addEventListener("click", e => { e.stopPropagation(); step(1); });
  lightbox.addEventListener("click", e => { if (e.target === lightbox || e.target.id === "lb-img-wrap") closeLightbox(); });
  document.addEventListener("keydown", e => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  load();
</script>
</body>
</html>
