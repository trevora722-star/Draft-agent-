name: Build & Upload PiledUp to TestFlight

# Runs on any push to the testflight-release branch (so Claude can trigger
# builds by pushing there), or manually from the GitHub Actions tab.
#
# No Mac needed anywhere: the pipeline mints its own Apple Distribution
# certificate through the App Store Connect API. Only four repository
# secrets are required — see piledup-ios/README.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
on:
  workflow_dispatch:
  push:
    branches:
      - testflight-release

jobs:
  testflight:
    runs-on: macos-15
    defaults:
      run:
        working-directory: piledup-ios
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
          [ -z "$ASC_KEY_ID" ] && missing+=(ASC_KEY_ID)
          [ -z "$ASC_ISSUER_ID" ] && missing+=(ASC_ISSUER_ID)
          [ -z "$ASC_KEY_P8" ] && missing+=(ASC_KEY_P8)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them at Settings → Secrets and variables → Actions. Instructions: piledup-ios/README.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Mint Apple Distribution certificate via App Store Connect API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/certvenv"
          "$RUNNER_TEMP/certvenv/bin/pip" install --quiet pyjwt cryptography requests
          "$RUNNER_TEMP/certvenv/bin/python" scripts/asc_make_cert.py

      - name: Import certificate into a temporary keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          curl -sSo wwdrg3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sSo wwdrg4.cer https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer
          security import wwdrg3.cer -k "$KEYCHAIN_PATH" -t cert -A || true
          security import wwdrg4.cer -k "$KEYCHAIN_PATH" -t cert -A || true
          security import dist.p12 -k "$KEYCHAIN_PATH" -f pkcs12 -P "$P12_PASSWORD_GEN" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Fill in team ID
        run: sed -i '' "s/__TEAM_ID__/${{ secrets.APPLE_TEAM_ID }}/" ExportOptions.plist

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="PiledUp CI AppStore" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
