# Netlify deploy config for the HandeeFriend Growth Agent control center.
#
# Publishes the static HTML interfaces for the 26-agent system at the repo
# root URL. The pages embed a fallback agent registry, so they work even
# without a backend — runner-dependent features (Run live, logs, output
# files) light up once you paste the runner URL + RUNNER_SECRET into the
# settings panel of agents.html.
#
# Usage:
#   1. In Netlify: Add new site → Import an existing project → pick this repo.
#   2. Pick branch `claude/handeefriend-growth-agents-WdMPd`.
#   3. Click Deploy. No env vars required.

[build]
  publish = "handeefriend-growth-agent/interfaces"
  command = "echo 'static deploy — no build step'"

# Land users directly on the agent control center.
[[redirects]]
  from = "/"
  to   = "/agents.html"
  status = 302

# Light cache so config tweaks propagate quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
