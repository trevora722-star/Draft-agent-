# Netlify deploy config — Squamish Adventure Rentals site.
#
# Usage:
#   1. Push this branch to GitHub.
#   2. In Netlify: Add new site → Import an existing project → pick the repo.
#   3. Set ANTHROPIC_API_KEY in Site settings → Environment variables (for chat agent).
#   4. (Optional) Set STRIPE_SECRET_KEY to wire real card charging.
#   5. Trigger a deploy.
#
# Static pages in `public/` (index/booking/payment + assets). The /api/* routes
# below are Python Netlify Functions: chat agent (Haiku 4.5), booking creation,
# and payment finalization. The legacy NPO demo functions are kept so the
# /api/demo/* endpoints still work for the BCSS walkthrough.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # Each function bundle ships with the npo_agent source tree alongside it.
  # _shared.py prepends the bundled path to sys.path on cold start.
  included_files = ["src/npo_agent/**"]

[functions."chat"]
  # Haiku 4.5 + cached system prompt. Typical 1–3s; 10s ceiling for cold start.
  timeout = 10

[functions."booking"]
  # No LLM call — validation + JSON write to /tmp.
  timeout = 10

[functions."payment"]
  # No LLM call — payment finalization. Real Stripe call would still fit easily.
  timeout = 10

[functions."demo_info"]
  timeout = 10
[functions."demo_scrub"]
  timeout = 10
[functions."demo_draft"]
  timeout = 10
[functions."demo_ask"]
  timeout = 10

# ---- routing ---------------------------------------------------------------
# Pretty URLs for the rentals site.

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment"
  to = "/.netlify/functions/payment"
  status = 200
  force = true

# Legacy NPO demo endpoints (kept so /demo.html still works).

[[redirects]]
  from = "/api/demo/info"
  to = "/.netlify/functions/demo_info"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo/preview-scrub"
  to = "/.netlify/functions/demo_scrub"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo/draft"
  to = "/.netlify/functions/demo_draft"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo/ask"
  to = "/.netlify/functions/demo_ask"
  status = 200
  force = true
