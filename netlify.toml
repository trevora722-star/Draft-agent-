# Netlify deploy config — wedding photo album (this branch only).
#
# NOTE: on the default branch this file describes the NPO agent demo instead.
# When creating the site in Netlify, set the production branch to
# `claude/wedding-photo-platform-mxs50e` to get the wedding album.
#
# Usage:
#   1. In Netlify: Add new site -> Import an existing project -> pick this repo.
#   2. Site configuration -> Build & deploy -> set the production branch to
#      claude/wedding-photo-platform-mxs50e.
#   3. Site configuration -> Environment variables -> add:
#        WEDDING_USERNAME        login you'll share with guests
#        WEDDING_PASSWORD        password you'll share with guests
#        WEDDING_ADMIN_PASSWORD  (optional) different password, same username,
#                                that can delete photos
#        WEDDING_TITLE           (optional) e.g. "Anna & James — June 2026"
#   4. Deploy. Photos are stored in Netlify Blobs (works on the free tier).
#
# This edition is photos-only: the browser compresses each photo to a
# high-quality JPEG before upload to fit Netlify's function limits. For
# videos and full-resolution originals, use the Render deployment instead
# (see render.yaml and wedding-photos/README.md).

[build]
  publish = "wedding-photos/netlify/public"

[functions]
  directory = "wedding-photos/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
