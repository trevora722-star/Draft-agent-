# Netlify deploy config — TutorAgent (branch: claude/tutoragent-platform-build-0ignzn).
#
# Deploy steps:
#   1. Netlify → Add new site → Import an existing project → pick this repo,
#      and set the branch to deploy to claude/tutoragent-platform-build-0ignzn.
#      (Or, on an existing site: Site configuration → Build & deploy → Branches.)
#   2. Site configuration → Environment variables → add:
#        ANTHROPIC_API_KEY   (required for tutoring)
#        APP_PASSPHRASE      (required for login)
#        NOCODB_URL, NOCODB_API_TOKEN, NOCODB_BASE_ID
#            (strongly recommended on Netlify: functions are stateless, so
#             without NocoDB every request starts from an empty in-memory DB)
#        RESEND_API_KEY, DIGEST_TO_EMAIL          (weekly digest)
#        DO_SPACES_KEY, DO_SPACES_SECRET, DO_SPACES_BUCKET, DO_SPACES_REGION
#                                                 (PDF/photo archival, optional)
#   3. Deploy. The frontend is served from tutoragent/public; the whole API is
#      one streaming Functions v2 handler at /api/* (tutoragent/netlify-functions).
#
# The previous NPO-demo Netlify config lives on its own branch; this branch's
# config replaces it for TutorAgent deploys.

[build]
  publish = "tutoragent/public"
  command = "cd tutoragent && npm install --no-audit --no-fund"

[functions]
  directory = "tutoragent/netlify-functions"
  node_bundler = "esbuild"
