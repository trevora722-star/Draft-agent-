# Netlify deploy config — Sea-to-Sky ATV Co. multi-agent demo.
#
# The demo is a single self-contained HTML page in `public/demo.html`.
# No backend, no API key, no build step — just static hosting.
#
# Usage:
#   1. Push this branch to GitHub.
#   2. In Netlify: Add new site → Import an existing project → pick the repo.
#   3. Trigger a deploy. Netlify gives you a *.netlify.app URL — send that
#      link to the friends at the rental shop.

[build]
  publish = "public"

# Root → demo UI.
[[redirects]]
  from = "/"
  to = "/demo.html"
  status = 200
