<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couple dashboard</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 560px; margin: 0 auto;
         padding: 32px 20px 56px; background: #fdf6f0; color: #3a2e2a; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #7a675f; margin-top: 0; }
  .card { background: white; border-radius: 12px; padding: 18px; margin-top: 18px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  #qr img { display: block; margin: 0 auto; border-radius: 8px; }
  .link-row { display: flex; gap: 8px; align-items: center; }
  .link-row input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #d8c8bd;
                     font-size: 0.85rem; }
  .link-row button { padding: 8px 12px; border: none; border-radius: 8px; background: #b3785f;
                      color: white; font-weight: 600; }
  .stat { font-size: 2rem; font-weight: 700; }
  .stat-label { color: #7a675f; font-size: 0.9rem; }
  a.pill { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 20px;
           background: #f1e3d8; color: #3a2e2a; text-decoration: none; font-size: 0.9rem; }
  #digest-btn { padding: 12px 18px; border: none; border-radius: 10px; background: #b3785f;
                color: white; font-weight: 600; }
  #digest-output { margin-top: 14px; white-space: pre-wrap; font-size: 0.92rem; display: none; }
  #error { color: #a3352c; }
</style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="error" style="display:none">This link looks incomplete or invalid.</div>

  <div id="dashboard" style="display:none">
    <h1 id="title"></h1>
    <p class="sub">Everything guests are sharing, in one place.</p>

    <div class="card" id="qr">
      <h2>QR code for guests</h2>
      <img id="qr-img" width="220" height="220" alt="QR code">
      <div class="link-row" style="margin-top:12px">
        <input type="text" id="guest-url" readonly>
        <button id="copy-btn">Copy</button>
      </div>
    </div>

    <div class="card">
      <h2>Needs a look</h2>
      <div class="stat" id="pending-count">0</div>
      <div class="stat-label">photo(s) flagged for review</div>
      <a class="pill" id="review-link" href="#">Open review queue →</a>
    </div>

    <div class="card">
      <h2>Highlight reel</h2>
      <button id="digest-btn">Generate highlight reel</button>
      <div id="digest-output"></div>
    </div>

    <div class="card">
      <a class="pill" id="gallery-link" href="#">View live gallery →</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event");
    const token = params.get("token");

    async function load() {
      if (!eventId || !token) return showError();
      try {
        const res = await fetch(`/events/${eventId}/info?token=${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error();
        const info = await res.json();
        if (!info.guest_upload_url) throw new Error(); // not a moderator token

        document.getElementById("title").textContent = `${info.couple_names}'s Dashboard`;
        document.getElementById("qr-img").src = `/events/${eventId}/qr.png`;
        document.getElementById("guest-url").value = info.guest_upload_url;
        document.getElementById("pending-count").textContent = info.pending_review_count;
        document.getElementById("review-link").href =
          `review.html?event=${eventId}&token=${encodeURIComponent(token)}`;
        document.getElementById("gallery-link").href =
          `gallery.html?event=${eventId}&token=${encodeURIComponent(info.guest_token)}`;

        document.getElementById("loading").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
      } catch (e) {
        showError();
      }
    }

    function showError() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "block";
    }

    document.getElementById("copy-btn")?.addEventListener("click", () => {
      const input = document.getElementById("guest-url");
      input.select();
      navigator.clipboard?.writeText(input.value);
    });

    document.getElementById("digest-btn")?.addEventListener("click", async (e) => {
      const btn = e.target;
      btn.disabled = true;
      btn.textContent = "Generating...";
      try {
        const res = await fetch(`/events/${eventId}/digest?token=${encodeURIComponent(token)}`);
        const digest = await res.json();
        const out = document.getElementById("digest-output");
        out.textContent = `${digest.subject}\n\n${digest.body}`;
        out.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Regenerate highlight reel";
      }
    });

    load();
  </script>
</body>
</html>
