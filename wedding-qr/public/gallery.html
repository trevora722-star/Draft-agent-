<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live wedding gallery</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px;
         background: #1c1614; color: #f4ece6; }
  h1 { text-align: center; font-weight: 500; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 14px; margin-top: 20px; }
  .card { background: #2a211d; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
  .card .meta { padding: 8px 10px; font-size: 0.85rem; color: #cbb9ae; }
  .card .meta .name { font-weight: 600; color: #f4ece6; }
  #empty { text-align: center; color: #a4938a; margin-top: 60px; }
</style>
</head>
<body>
  <h1>Live gallery</h1>
  <div id="empty">Waiting for the first photo...</div>
  <div id="grid"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event");
    const token = params.get("token");
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const seen = new Set();

    async function poll() {
      if (!eventId || !token) return;
      try {
        const res = await fetch(`/events/${eventId}/gallery?token=${encodeURIComponent(token)}`);
        if (!res.ok) return;
        const items = await res.json();
        empty.style.display = items.length ? "none" : "block";
        for (const p of items) {
          if (seen.has(p.id)) continue;
          seen.add(p.id);
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${p.thumbnail_url}" alt="">
            <div class="meta">
              ${p.guest_name ? `<span class="name">${p.guest_name}</span> · ` : ""}
              ${p.caption || ""}
            </div>`;
          grid.prepend(card);
        }
      } catch (e) { /* transient network hiccup, next poll will retry */ }
    }
    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
