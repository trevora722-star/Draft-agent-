[project]
name = "wedding-qr"
version = "0.1.0"
description = "Agentic wedding photo sharing: QR upload → moderation → captioning → curated highlight reel."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4",
    "Pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
