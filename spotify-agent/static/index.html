<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotify AI Agent</title>
  <style>
    :root { --green: #1DB954; --bg: #121212; --panel: #181818; --text: #f5f5f5; --muted: #b3b3b3; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; background: var(--panel); display: flex; align-items: center;
             justify-content: space-between; border-bottom: 1px solid #282828; }
    header h1 { font-size: 18px; margin: 0; }
    header .who { color: var(--muted); font-size: 14px; }
    a.btn, button.btn { background: var(--green); color: #000; border: none; border-radius: 999px;
            padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 14px; }
    button.btn:disabled { opacity: .5; cursor: default; }
    a.link { color: var(--muted); font-size: 13px; text-decoration: none; margin-left: 14px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
    .msg { padding: 12px 16px; border-radius: 14px; margin: 10px 0; line-height: 1.5; white-space: pre-wrap;
           word-wrap: break-word; max-width: 85%; }
    .user { background: var(--green); color: #000; margin-left: auto; }
    .agent { background: var(--panel); }
    .agent a { color: var(--green); }
    .hint { color: var(--muted); text-align: center; margin-top: 40px; }
    .hint code { background: #282828; padding: 2px 6px; border-radius: 6px; }
    form { display: flex; gap: 10px; padding: 16px 20px; background: var(--panel);
           border-top: 1px solid #282828; max-width: 760px; width: 100%; margin: 0 auto; }
    input[type=text] { flex: 1; padding: 12px 16px; border-radius: 999px; border: 1px solid #333;
            background: #0e0e0e; color: var(--text); font-size: 15px; }
    .gate { text-align: center; margin: auto; padding: 40px; }
    .gate p { color: var(--muted); max-width: 420px; }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Spotify AI Agent</h1>
    <div id="account"></div>
  </header>

  <div id="chat"></div>

  <form id="form" style="display:none">
    <input id="input" type="text" autocomplete="off"
           placeholder="e.g. Create a playlist called 'Smooth Woodturning Beats' with chill lo-fi tracks" />
    <button class="btn" type="submit" id="send">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const account = document.getElementById('account');

    // Escape HTML, then turn bare URLs into clickable links.
    function render(text) {
      const esc = text.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function bubble(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.innerHTML = render(text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function init() {
      const me = await fetch('/api/me').then(r => r.json());
      if (me.logged_in) {
        account.innerHTML =
          `<span class="who">${me.display_name || 'Logged in'}</span>` +
          `<a class="link" href="/logout">Log out</a>`;
        form.style.display = 'flex';
        chat.innerHTML =
          `<div class="hint">Ask me to build a playlist. For example:<br>` +
          `<code>Create a playlist called 'Smooth Woodturning Beats' with some chill lo-fi tracks</code></div>`;
        input.focus();
      } else {
        chat.innerHTML =
          `<div class="gate">
             <p>Log in with your Spotify account and ask the agent to build playlists for you in plain English.</p>
             <a class="btn" href="/login">Log in with Spotify</a>
           </div>`;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      bubble(text, 'user');
      input.value = '';
      send.disabled = true; input.disabled = true;
      const thinking = bubble('Thinking…', 'agent');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        thinking.innerHTML = render(res.ok ? data.reply : ('⚠️ ' + (data.detail || 'Something went wrong.')));
      } catch (err) {
        thinking.innerHTML = render('⚠️ Network error: ' + err);
      } finally {
        send.disabled = false; input.disabled = false; input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    });

    init();
  </script>
</body>
</html>
